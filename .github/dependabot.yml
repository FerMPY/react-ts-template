version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      oxc:
        patterns: ["oxlint", "oxlint-*", "oxfmt"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite-and-vitest:
        patterns:
          ["vite", "@vitejs/*", "oxc-transform-react", "vitest", "@vitest/*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Matches the Node major in .node-version; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react pins a 0.x range (e.g. ^0.152.0 allows only 0.152.x).
      # Bump it by hand when the plugin's peer range moves.
      - dependency-name: "oxc-transform-react"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
