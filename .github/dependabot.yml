version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      oxc:
        patterns: ["oxlint", "oxlint-*", "oxfmt"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # oxc-transform-react must stay in the range @vitejs/plugin-react expects.
      vite-and-vitest:
        patterns:
          ["vite", "@vitejs/*", "oxc-transform-react", "vitest", "@vitest/*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Matches the Node major in .node-version; bump both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
